name: GFI Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gfi-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose Discord webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import hashlib
          import os

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          print(f"Webhook length: {len(webhook)}")
          print(f"Webhook SHA256: {hashlib.sha256(webhook.encode()).hexdigest()}")
          PY

      - name: Run GFI bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python check_new_issues.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update issue tracking state"
          git push
